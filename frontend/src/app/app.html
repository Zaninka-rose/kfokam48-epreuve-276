<main class="page">
	<section class="carte" [attr.data-statut]="statut()">
		<h1>KFOKAM48 — Suivi des présences</h1>
		<p>Squelette frontend Angular 22, guidé par le contrat OpenAPI.</p>

		@if (statut() === 'en_cours') {
			<p class="ligne-statut">Vérification du backend…</p>
		} @else if (statut() === 'ok') {
			<p class="ligne-statut statut-ok">✅ {{ message() }}</p>
		} @else {
			<p class="ligne-statut statut-ko">❌ {{ message() }}</p>
			<p class="aide">Démarre le backend : <code>cd backend && ./mvnw spring-boot:run</code></p>
		}
	</section>
</main>
