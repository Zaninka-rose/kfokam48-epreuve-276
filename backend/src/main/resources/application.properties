spring.application.name=backend

server.port=8080

# --- DataSource H2 (dev) : remplacée par PostgreSQL en prod sans changer le code ---
spring.datasource.url=jdbc:h2:mem:backend;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA : le schema appartient a Flyway (B5) ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Actuator : health publique pour le dev ---
management.endpoints.web.exposure.include=health,info
