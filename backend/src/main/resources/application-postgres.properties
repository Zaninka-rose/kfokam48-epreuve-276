# --- Profil "postgres" : base PostgreSQL (docker compose up -d db) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/backend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=backend
spring.datasource.password=backend

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Les migrations V1/V2 sont écrites en SQL portable (IDENTITY, CHECK, TIMESTAMP
# WITH TIME ZONE) : elles passent telles quelles sur PostgreSQL.
spring.flyway.enabled=true
